services:
  receiver:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      CATCHME_SERVER_TOKEN: ${CATCHME_SERVER_TOKEN:?set CATCHME_SERVER_TOKEN}
    volumes:
      - catchme-server-data:/data
    ports:
      - "127.0.0.1:8780:8780"

volumes:
  catchme-server-data:
